<!doctype html>
<html lang="fr" data-theme="etu">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

    <!-- Tailwind CDN config -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              display: ['"Plus Jakarta Sans"', 'sans-serif'],
              sans: ['"Inter"', 'sans-serif'],
            },
            colors: {
              etu: {
                50:  '#f2f5fa',
                100: '#f1f4f9',
                200: '#ecedf5',
                300: '#d0d7e1',
                400: '#b0bcd0',
                500: '#7b8fb0',
                600: '#4f6090',
                accent: '#4f46e5',
                'accent-light': '#ecedf5',
              },
            },
          },
        },
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>

    <title>ETU3209 — Gestion commerciale</title>

    <style>
      /* Smooth page transitions */
      #root { animation: fadeIn 0.25s ease; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

      /* Custom scrollbar */
      ::-webkit-scrollbar { width: 5px; height: 5px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #d0d7e1; border-radius: 99px; }
      ::-webkit-scrollbar-thumb:hover { background: #b0bcd0; }

      /* Selection */
      ::selection { background: #ecedf5; color: #4f46e5; }
    </style>
  </head>
  <body class="bg-[#f2f5fa] text-gray-900 font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
